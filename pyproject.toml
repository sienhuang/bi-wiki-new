[project]
name = "bi-wiki"
version = "0.1.0"
description = "BI Wiki / Ontology service foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "httpx>=0.27,<1",
  "boto3>=1.36,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
bi-wiki = "bi_wiki.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bi_wiki"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/bi_wiki",
  "/tests",
  "/docs",
  "/README.md",
  "/.env.example",
  "/AGENTS.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["bi_wiki"]
